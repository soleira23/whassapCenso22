<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Censo Editor</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM por CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [content, setContent] = useState("");
            const [copied, setCopied] = useState(false);
            const [startLine, setStartLine] = useState("10");
            const [endLine, setEndLine] = useState("20");
            const [replacementText, setReplacementText] = useState("");
            const [showLineNumbers, setShowLineNumbers] = useState(false);
            const [currentLine, setCurrentLine] = useState(0);

            const lines = content.split("\n");

            const handleCopy = async () => {
                try {
                    await navigator.clipboard.writeText(content);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch {
                    const textarea = document.createElement("textarea");
                    textarea.value = content;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            const handleReplaceLines = () => {
                const startIdx = parseInt(startLine) - 1;
                const endIdx = parseInt(endLine) - 1;
                
                if (startIdx >= 0 && endIdx < lines.length && startIdx <= endIdx && replacementText) {
                    const newLines = [
                        ...lines.slice(0, startIdx),
                        replacementText,
                        ...lines.slice(endIdx + 1)
                    ];
                    setContent(newLines.join("\n"));
                    setReplacementText("");
                }
            };

            const getLineCount = () => (!content ? 0 : lines.length);

            const getLineContent = (lineNumber) => {
                if (lineNumber >= 1 && lineNumber <= lines.length) {
                    return lines[lineNumber - 1];
                }
                return "";
            };

            const handleCursorCheck = (e) => {
                const textarea = e.currentTarget;
                const cursorPos = textarea.selectionStart;
                const textBeforeCursor = content.substring(0, cursorPos);
                const lineNumber = textBeforeCursor.split("\n").length;
                setCurrentLine(lineNumber);
            };

            const getLinePreview = (lineNumber) => {
                const lineContent = getLineContent(lineNumber);
                if (!lineContent) return "Línea vacía";
                return lineContent.length > 60 ? lineContent.substring(0, 60) + "..." : lineContent;
            };

            return (
                <div className="min-h-screen bg-slate-100">
                    <header className="bg-emerald-700 text-white shadow-md">
                        <div className="mx-auto max-w-7xl px-6 py-6 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="rounded-xl bg-emerald-600 p-2.5 shadow-inner">
                                    📄
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-tight">WhatsApp Censo Editor</h1>
                                    <p className="text-sm text-emerald-100">Formatea y copia censos hospitalarios largos sin perder formato</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setContent("")}
                                    className="flex items-center bg-emerald-600 text-white hover:bg-emerald-500 px-3 py-2 rounded-lg text-sm font-medium transition"
                                >
                                    🧹 Limpiar
                                </button>
                                <button
                                    onClick={handleCopy}
                                    className="flex items-center bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-lg text-sm font-semibold shadow transition"
                                >
                                    {copied ? "✅ ¡Copiado!" : "📋 Copiar a WhatsApp"}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="mx-auto max-w-7xl px-6 py-8">
                        {/* Panel de información */}
                        <div className="mb-6 rounded-xl border border-emerald-200 bg-white shadow-md p-6">
                            <h2 className="text-base font-semibold text-emerald-900 mb-4 pb-2 border-b border-slate-100">
                                👁️ Información de líneas
                            </h2>
                            <div className="grid grid-cols-1 gap-4 md:grid-cols-3">
                                <div className="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4">
                                    <div className="text-sm font-semibold text-emerald-800">Línea actual del cursor</div>
                                    {currentLine > 0 ? (
                                        <div className="mt-2">
                                            <div className="text-xl font-bold text-emerald-700">Línea {currentLine}</div>
                                            <div className="mt-1 rounded bg-white p-2 font-mono text-xs text-slate-700 truncate">{getLinePreview(currentLine)}</div>
                                        </div>
                                    ) : (
                                        <div className="mt-2 text-sm text-slate-500">Haz clic en cualquier línea del editor</div>
                                    )}
                                </div>

                                <div className="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4">
                                    <div className="text-sm font-semibold text-emerald-800">Línea de inicio ({startLine || "?"})</div>
                                    <div className="mt-2 rounded bg-white p-2 font-mono text-xs text-slate-700 truncate">
                                        {getLinePreview(parseInt(startLine) || 0)}
                                    </div>
                                </div>

                                <div className="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4">
                                    <div className="text-sm font-semibold text-emerald-800">Línea de fin ({endLine || "?"})</div>
                                    <div className="mt-2 rounded bg-white p-2 font-mono text-xs text-slate-700 truncate">
                                        {getLinePreview(parseInt(endLine) || 0)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Panel de reemplazo */}
                        <div className="mb-6 rounded-xl border border-emerald-200 bg-white shadow-md p-6">
                            <h2 className="text-base font-semibold text-emerald-900 mb-4 pb-2 border-b border-slate-100">
                                🔄 Reemplazar rango de líneas
                            </h2>
                            <div className="flex flex-wrap items-end gap-3">
                                <div className="w-32">
                                    <label className="text-sm font-medium text-slate-700">Desde línea</label>
                                    <input
                                        type="number"
                                        min="1"
                                        max={getLineCount()}
                                        value={startLine}
                                        onChange={(e) => setStartLine(e.target.value)}
                                        className="mt-1 w-full rounded-lg border border-emerald-200 p-2 text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                    />
                                </div>
                                <div className="w-32">
                                    <label className="text-sm font-medium text-slate-700">Hasta línea</label>
                                    <input
                                        type="number"
                                        min="1"
                                        max={getLineCount()}
                                        value={endLine}
                                        onChange={(e) => setEndLine(e.target.value)}
                                        className="mt-1 w-full rounded-lg border border-emerald-200 p-2 text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                    />
                                </div>
                                <div className="flex-1 min-w-[280px]">
                                    <label className="text-sm font-medium text-slate-700">Texto de reemplazo</label>
                                    <textarea
                                        value={replacementText}
                                        onChange={(e) => setReplacementText(e.target.value)}
                                        placeholder="Escribe el nuevo texto..."
                                        className="mt-1 w-full rounded-lg border border-emerald-200 p-2 text-sm focus:ring-2 focus:ring-emerald-400 outline-none h-10 resize-none"
                                    />
                                </div>
                                <button
                                    onClick={handleReplaceLines}
                                    disabled={!replacementText || !startLine || !endLine}
                                    className="bg-emerald-600 text-white hover:bg-emerald-500 disabled:opacity-50 px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2"
                                >
                                    Reemplazar rango
                                </button>
                            </div>
                            <div className="mt-4 flex items-center justify-between text-sm text-slate-600 pt-3 border-t border-slate-100">
                                <span>El documento tiene <strong>{getLineCount()}</strong> líneas</span>
                                <button
                                    onClick={() => setShowLineNumbers(!showLineNumbers)}
                                    className="border border-emerald-200 text-emerald-700 hover:bg-emerald-50 px-3 py-1 rounded-lg text-xs font-semibold transition"
                                >
                                    {showLineNumbers ? "Ocultar" : "Mostrar"} números de línea
                                </button>
                            </div>
                        </div>

                        {/* Editor y Vista Previa */}
                        <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
                            {/* Editor */}
                            <div className="rounded-xl border border-emerald-200 bg-white shadow-lg p-4">
                                <div className="mb-3 flex items-center justify-between border-b pb-2">
                                    <span className="rounded-lg bg-emerald-600 px-2 py-1 text-xs font-bold text-white">EDITAR</span>
                                    <span className="text-xs text-slate-400">Escribe o pega tu censo</span>
                                </div>
                                <div className="relative flex">
                                    {showLineNumbers && (
                                        <div className="w-12 bg-emerald-50 border-r border-emerald-200 select-none py-3 font-mono text-xs text-emerald-600 text-right pr-2">
                                            {lines.map((_, i) => (
                                                <div key={i} className="leading-relaxed">{i + 1}</div>
                                            ))}
                                        </div>
                                    )}
                                    <textarea
                                        value={content}
                                        onChange={(e) => setContent(e.target.value)}
                                        onClick={handleCursorCheck}
                                        onKeyUp={handleCursorCheck}
                                        placeholder="Pega aquí tu censo hospitalario..."
                                        className={`w-full h-[500px] bg-slate-50 p-4 font-mono text-sm leading-relaxed text-slate-800 border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none resize-none ${showLineNumbers ? "pl-3" : ""}`}
                                    />
                                </div>
                            </div>

                            {/* Vista Previa */}
                            <div className="rounded-xl border border-emerald-200 bg-white shadow-lg p-4 flex flex-col">
                                <div className="mb-3 flex items-center justify-between border-b pb-2">
                                    <span className="rounded-lg bg-emerald-600 px-2 py-1 text-xs font-bold text-white">VISTA PREVIA</span>
                                    <span className="text-xs text-slate-500">💬 WhatsApp</span>
                                </div>
                                <div className="flex-1 rounded-xl bg-[#e5ddd5] p-4 flex flex-col justify-between overflow-hidden">
                                    <div className="flex-1 overflow-y-auto rounded-lg bg-white p-4 shadow-sm">
                                        {content.trim().length === 0 ? (
                                            <p className="text-center text-slate-400 mt-32 text-sm">Aún no hay contenido para mostrar...</p>
                                        ) : (
                                            <div className="whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-slate-800">
                                                {content}
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-3 flex justify-between text-xs text-slate-600">
                                        <span>{content.length} caracteres</span>
                                        <span>{lines.length} líneas</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
